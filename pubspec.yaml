name: jueceo_coreografias_tablet
description: Android tablet companion for Jueceo Coreografias.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  pdf: ^3.11.1
  printing: ^5.13.4
  file_picker: ^8.1.2
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/levitate_logo.png
    - assets/data/app_data.json
